env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://quehaypahacer.web.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: quehaypahacer-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: quehaypahacer-prod
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: quehaypahacer-prod.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: firebaseServiceAccountJson
    availability:
      - BUILD
      - RUNTIME
  - variable: COOKIE_SECRET_CURRENT
    secret: cookieSecretCurrent
    availability:
      - RUNTIME

  - variable: COOKIE_SECRET_PREVIOUS
    secret: cookieSecretPrevious
    availability:
      - RUNTIME

  - variable: EVENT_MODERATION_WEBHOOK_SECRET
    secret: eventModerationWebhookSecret
    availability:
      - RUNTIME

  # La llama la Cloud Function notifySiteModeration (y los scripts de reclamos) para refrescar cachés.
  # El secreto debe existir en Secret Manager ANTES de desplegar (ver docs/17-notificaciones.md).
  - variable: SITE_REVALIDATE_WEBHOOK_SECRET
    secret: siteRevalidateWebhookSecret
    availability:
      - RUNTIME
