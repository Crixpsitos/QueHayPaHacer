env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://quehaypahacer.web.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: quehaypahacer-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: quehaypahacer-prod
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: quehaypahacer-prod.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: firebaseServiceAccountJson
    availability:
      - BUILD
      - RUNTIME
  - variable: COOKIE_SECRET_CURRENT
    secret: cookieSecretCurrent
    availability:
      - RUNTIME

  - variable: COOKIE_SECRET_PREVIOUS
    secret: cookieSecretPrevious
    availability:
      - RUNTIME

  - variable: EVENT_MODERATION_WEBHOOK_SECRET
    secret: eventModerationWebhookSecret
    availability:
      - RUNTIME

  # PENDIENTE (se activa al cerrar, ver docs/17-notificaciones.md): SITE_REVALIDATE_WEBHOOK_SECRET <- secreto
  # siteRevalidateWebhookSecret. NO declararlo antes de crear el secreto: un secreto inexistente rompe el rollout.
  # Mientras tanto /api/sites/revalidate y /api/events/revalidate responden 503 (inofensivo).
