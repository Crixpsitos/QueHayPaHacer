env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://quehaypahacer.web.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: quehaypahacer-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: quehaypahacer-prod
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: quehaypahacer-prod.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: firebaseServiceAccountJson
    availability:
      - BUILD
      - RUNTIME
  - variable: COOKIE_SECRET_CURRENT
    secret: cookieSecretCurrent
    availability:
      - RUNTIME

  - variable: COOKIE_SECRET_PREVIOUS
    secret: cookieSecretPrevious
    availability:
      - RUNTIME

  - variable: EVENT_MODERATION_WEBHOOK_SECRET
    secret: eventModerationWebhookSecret
    availability:
      - RUNTIME

  # PENDIENTE hasta crear el secreto EN PROD: SITE_REVALIDATE_WEBHOOK_SECRET <- secreto siteRevalidateWebhookSecret
  # (mismo valor que el secreto SITE_REVALIDATE_WEBHOOK_SECRET de las functions de prod; ver docs/17 y docs/15).
  # NO declararlo antes: un secreto inexistente rompe el rollout. Sin él, los endpoints de refresco responden 503.
