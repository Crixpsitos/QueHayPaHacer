# Capacidad de Cloud Run en producción. Los valores = lo que ya corría (cpu 2, 1 GB, concurrencia 80, mínimo 0), salvo
# `maxInstances`: 10 → 5. Es un TECHO de gasto (un pico o un bot no puede encender más de 5 servidores); no sube costos.
# `minInstances` se queda en 0 a propósito: subirlo sí cobra por tener servidores encendidos sin tráfico.
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 2
  memoryMiB: 1024

env:
  # Dominio propio de producción (sitemap, robots, canónicas y vistas previas).
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://yquehaypahacer.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: quehaypahacer-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: quehaypahacer-prod
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: quehaypahacer-prod.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: firebaseServiceAccountJson
    availability:
      - BUILD
      - RUNTIME
  - variable: COOKIE_SECRET_CURRENT
    secret: cookieSecretCurrent
    availability:
      - RUNTIME

  - variable: COOKIE_SECRET_PREVIOUS
    secret: cookieSecretPrevious
    availability:
      - RUNTIME

  - variable: EVENT_MODERATION_WEBHOOK_SECRET
    secret: eventModerationWebhookSecret
    availability:
      - RUNTIME

  # Refresco inmediato de cachés: lo llaman las Cloud Functions de prod (mismo valor que el secreto de functions
  # SITE_REVALIDATE_WEBHOOK_SECRET; ver docs/17 y docs/15).
  - variable: SITE_REVALIDATE_WEBHOOK_SECRET
    secret: siteRevalidateWebhookSecret
    availability:
      - RUNTIME

  # Configuración del cliente web de Firebase de prod (se guardan como secretos igual que en develop).
  # Sin estas variables el login falla.
  - variable: FIREBASE_API_KEY
    secret: firebaseApiKey
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebaseApiKey
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: firebaseAppId
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: firebaseMessagingSenderId
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: firebaseMeasurementId
    availability:
      - BUILD
      - RUNTIME

  # Cuenta admin de QHPA (uid no es secreto): publica sin auditoría posterior y accede a acciones de admin.
  - variable: QHPA_ADMIN_UIDS
    value: rwBy8op3QSRseVwU7EeCnYneCHw1
    availability:
      - RUNTIME

  # Correo (Resend), dominio avisos.yquehaypahacer.com verificado. Falta: RESEND_WEBHOOK_SECRET y NEXT_PUBLIC_FIREBASE_VAPID_KEY
  # (ver docs/36-correo-y-push-pasos.md). Sin EMAIL_FROM el servicio queda apagado y no envía nada.
  - variable: EMAIL_FROM
    value: "Qué Hay Pa Hacer <avisos@avisos.yquehaypahacer.com>"
    availability:
      - RUNTIME

  - variable: EMAIL_DAILY_CAP
    value: "100"
    availability:
      - RUNTIME

  - variable: RESEND_API_KEY
    secret: resendApiKey
    availability:
      - RUNTIME

  - variable: EMAIL_UNSUBSCRIBE_SECRET
    secret: emailUnsubscribeSecret
    availability:
      - RUNTIME
