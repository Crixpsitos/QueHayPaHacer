# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  cpu: 2
  memoryMiB: 1024

# Environment variables and secrets.
env:
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: firebaseServiceAccountJson
    availability:
      - BUILD
      - RUNTIME

  # Firebase client SDK public variables — resto se configura en Firebase Console > App Hosting > Environment variables
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: quehaypahacer-develop.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: quehaypahacer-develop
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: quehaypahacer-develop.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://quehaypahacerdev--quehaypahacer-develop.us-central1.hosted.app/
    availability:
      - BUILD
      - RUNTIME

  # Cookie secrets for next-firebase-auth-edge
  - variable: COOKIE_SECRET_CURRENT
    secret: cookieSecretCurrent
    availability:
      - RUNTIME

  - variable: COOKIE_SECRET_PREVIOUS
    secret: cookieSecretPrevious
    availability:
      - RUNTIME

  - variable: EVENT_MODERATION_WEBHOOK_SECRET
    secret: eventModerationWebhookSecret
    availability:
      - RUNTIME

  # La llaman las Cloud Functions notifySiteModeration y notifyEventChanges (y los scripts de reclamos y configuración)
  # para refrescar cachés al instante. Debe existir en Secret Manager antes de desplegar (docs/17-notificaciones.md).
  - variable: SITE_REVALIDATE_WEBHOOK_SECRET
    secret: siteRevalidateWebhookSecret
    availability:
      - RUNTIME

  # Android TWA (Digital Asset Links → /.well-known/assetlinks.json).
  # Ver docs/12-pwa-y-google-play.md. Las huellas son públicas (se sirven en
  # assetlinks.json), no hace falta secret. App Hosting rechaza entradas sin
  # `value`/`secret`: descomentar ANDROID_SHA256_CERT_FINGERPRINTS al tener la huella.
  - variable: ANDROID_PACKAGE_NAME
    value: com.quehaypahacer.app
    availability:
      - RUNTIME

  # - variable: ANDROID_SHA256_CERT_FINGERPRINTS
  #   value: "AA:BB:...:FF"   # SHA-256 de Play App Signing; varias separadas por coma
  #   availability:
  #     - RUNTIME
